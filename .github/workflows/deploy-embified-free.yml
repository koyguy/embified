name: Deploy embified-free

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.24.138.220
          username: ubuntu
          key: ${{ secrets.EMBIFIED_SSH_KEY }}
          script: sudo /usr/local/bin/embified-update