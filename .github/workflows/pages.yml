name: Publish public site (GitHub Pages)

# Publishes site/ (signup quest + setup guides) to https://koyguy.github.io/embified/.
# Pages source must be "GitHub Actions" (Settings → Pages). For a custom domain later,
# add site/CNAME and set the domain in Settings → Pages (see docs/PUBLIC_SITE.md).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links resolve
        run: |
          cd site
          fail=0
          for f in *.html; do
            for ref in $(grep -oE '(href|src)="[^"#:]+"' "$f" | sed -E 's/^(href|src)="//; s/"$//; s/\?.*$//'); do
              case "$ref" in ./|'') continue ;; esac
              [ -e "$ref" ] || { echo "::error file=site/$f::broken link $ref"; fail=1; }
            done
          done
          exit $fail
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
