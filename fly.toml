app = "embified"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  AUTH_DIR = "/data/auth_info"
  DATA_DIR = "/data/store"
  WA_PROVIDER = "baileys"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "embified_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
