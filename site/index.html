<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Embified — Free 200 GB WhatsApp group vault (chat setup)</title>
    <meta name="description" content="Chat with the Embified assistant and get a free 200 GB WhatsApp group vault on your own Oracle Always Free cloud. One command does the setup." />
    <meta name="theme-color" content="#0b1410" />
    <meta property="og:title" content="Free 200 GB WhatsApp group vault on your own cloud" />
    <meta property="og:description" content="Never lose group history. Your chats stay on your own server. A friendly chat walks you through it." />
    <meta property="og:url" content="https://koyguy.github.io/embified/" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Embified"><span class="logo">E</span><span><b>Embified assistant</b><small id="status">online · free setup</small></span></a>
      <div class="xpchip" title="Your progress"><span>⚡</span><span id="xp">0</span>&nbsp;XP<span class="minibar"><span id="bar"></span></span></div>
    </header>
    <div class="levelbar"><span id="levelname">Newcomer</span><span id="badges"></span></div>
    <main id="log" aria-live="polite"></main>
    <footer class="composer">
      <div id="replies" class="replies"></div>
      <form id="inputrow" class="inputrow hidden" autocomplete="off" novalidate>
        <input id="text" type="url" inputmode="url" placeholder="https://….trycloudflare.com" aria-label="Your vault link" />
        <button type="submit" class="send" aria-label="Send">➤</button>
      </form>
      <div class="tools">
        <button type="button" id="faqbtn" class="ghost">❓ FAQ</button>
        <a class="ghost" href="quest.html">📋 Prefer a checklist?</a>
        <button type="button" id="restart" class="ghost">↺ Start over</button>
      </div>
    </footer>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div id="toast" class="toast hidden" role="status"></div>
    <script src="config.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
