<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Embified — Your own private WhatsApp group archive (chat setup)</title>
    <meta name="description" content="Chat with the Embified assistant and build your own private WhatsApp group archive on your own Oracle Always Free cloud. One command does the setup." />
    <meta name="theme-color" content="#0b1410" />
    <meta property="og:title" content="Your own private WhatsApp group archive on your own cloud" />
    <meta property="og:description" content="Never lose group history. Your chats stay on your own server. A friendly chat walks you through it." />
    <meta property="og:url" content="https://koyguy.github.io/embified/" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Embified"><span class="logo">E</span><span><b>Embified assistant</b><small id="status">online · free setup</small></span></a>
      <div class="vaultchip" title="How much of your vault is built"><span id="vaultdoor"></span><span id="pct">0%</span></div>
    </header>
    <section id="vaultbar" class="vaultbar" role="progressbar" aria-label="Your vault" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <ol id="stages" class="stages"></ol>
      <div id="vstatus" class="vstatus">Your vault is 0% built · about 30 minutes left</div>
    </section>
    <main id="log" aria-live="polite"></main>
    <footer class="composer">
      <div id="replies" class="replies"></div>
      <form id="inputrow" class="inputrow hidden" autocomplete="off" novalidate>
        <input id="text" type="url" inputmode="url" placeholder="https://….trycloudflare.com" aria-label="Your vault link" />
        <button type="submit" class="send" aria-label="Send">➤</button>
      </form>
      <div class="tools">
        <button type="button" id="faqbtn" class="ghost">❓ FAQ</button>
        <a class="ghost" href="quest.html">📋 Prefer a checklist?</a>
        <button type="button" id="restart" class="ghost">↺ Start over</button>
      </div>
    </footer>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div id="toast" class="toast hidden" role="status"></div>
    <script src="config.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
